<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SharpForge docking example</title>
  <link rel="stylesheet" href="../src/style.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e24; color: #dedee8; font: 13px system-ui; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px; }
    header h1 { font-size: 15px; margin: 0 12px 0 0; }
    header button { min-height: 32px; }
    #workspace { flex: 1; min-height: 0; }
    .example-content { padding: 12px; box-sizing: border-box; }
    textarea { width: 100%; height: 100%; box-sizing: border-box; background: #1e1e24; color: #dedee8; font: 14px monospace; }
    #status { margin: 0; padding: 4px 12px; min-height: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Docking workbench</h1>
    <button id="auto-hide">Auto Hide All</button>
    <button id="float-group">Float Watch + Output</button>
    <button id="restore">Reset</button>
    <button id="undo">Undo Layout</button>
    <button id="redo">Redo Layout</button>
  </header>
  <div id="workspace"></div>
  <p id="status" role="status">Drag tabs onto the nine explicit targets; Escape cancels a pointer drag.</p>
  <script type="module" src="./workbench.js"></script>
</body>
</html>
