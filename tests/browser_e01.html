<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>SharpForge E01 browser qualification</title>
<style>body{font:14px ui-monospace,monospace;padding:24px;background:#10151c;color:#e7edf5}pre{white-space:pre-wrap}.failed{color:#ff9b9b}</style>
<h1>SharpForge E01 browser qualification</h1>
<p id="state">Loading fixtures…</p><pre id="progress"></pre>
<script>
window.a05E01={done:false,checks:[],errors:[],result:null};
const state=document.getElementById('state'),progress=document.getElementById('progress');
function fatal(error){a05E01.errors.push(error);a05E01.done=true;state.textContent='Qualification failed';state.className='failed';}
fetch('./manifest.json').then(response=>{if(!response.ok)throw new Error('Manifest HTTP '+response.status);return response.json();}).then(manifest=>{
  a05E01.manifest=manifest;const worker=new Worker('./a05-e01.bundle.js');a05E01.worker=worker;state.textContent='Running actual bundled runtime in a classic worker…';
  worker.onmessage=({data})=>{
    if(data.kind==='progress'){a05E01.checks.push(data.item);progress.textContent+=(data.item.passed?'PASS ':'FAIL ')+data.item.engine+' '+data.item.name+'\n';}
    else if(data.kind==='result'){a05E01.result=data.result;a05E01.done=true;state.textContent=data.result.passed?'Qualification passed':'Qualification failed';if(!data.result.passed)state.className='failed';worker.terminate();}
    else if(data.kind==='fatal'){fatal(data.error);worker.terminate();}
  };
  worker.onerror=event=>fatal({name:'WorkerError',message:event.message,filename:event.filename,line:event.lineno,column:event.colno});
  worker.postMessage(manifest);
}).catch(error=>fatal({name:error.name,message:error.message,stack:error.stack}));
</script>
</html>
