name: Rendering completed-scope qualification
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check bounded image comparison and reference provenance
        run: python -m unittest discover -s tests/rendering -p 'test_*.py'
      - name: Render software WebGPU adapter and compare committed goldens
        run: python tests/rendering/gpu-runner.py --engine chromium --tier software --output artifacts/rendering/software
      - name: Enforce measured CPU draw-call and memory budgets
        run: node tests/rendering/budgets.bench.js artifacts/rendering/software/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rendering-software-qualification
          path: artifacts/rendering/
          if-no-files-found: error
