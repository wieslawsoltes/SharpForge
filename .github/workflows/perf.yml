name: Performance regression service
on:
  workflow_dispatch:
    inputs:
      base:
        description: Exact baseline revision (defaults to previous commit)
        required: false
        type: string
      baseline_reviewed:
        description: Confirm the initial committed baseline policy has been reviewed
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SHARPFORGE_RESULTS_DIR: artifacts/results
      PERF_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'HEAD^' }}
      PERF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE_REVIEWED: ${{ inputs.baseline_reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - run: npm ci
      - name: Performance service correctness
        run: node --test --test-concurrency=1 tests/conformance/performance/*.test.js
      - name: Timed A/A and injected-slowdown calibration
        run: node scripts/conformance/perf/controls.js
      - name: Resolve reviewed policy
        shell: bash
        run: |
          if git cat-file -e "$PERF_BASE:planning/qualification/size-budgets.json"; then
            echo "PERF_POLICY=$PERF_BASE" >> "$GITHUB_ENV"
          elif [ "$BASELINE_REVIEWED" = "true" ]; then
            echo "PERF_POLICY=$PERF_HEAD" >> "$GITHUB_ENV"
          else
            echo "Initial policy requires baseline_reviewed after review."
            exit 1
          fi
      - name: Run interleaved independent base/head samples
        run: node scripts/conformance/perf/ab.js --base "$PERF_BASE" --head "$PERF_HEAD" --pairs 20 --policy-ref "$PERF_POLICY" --output artifacts/results/performance/ab
      - name: Publish median, tails and verdict
        if: always()
        run: node scripts/conformance/perf/summary.js --input artifacts/results/performance/ab/comparison.json
      - name: Gate A15 property latency and managed allocations at twenty percent
        run: node scripts/benchmarks/a15-property-gate.mjs --head "$PERF_HEAD" --output artifacts/results/performance/property
      - name: Capture all existing benchmark producers
        run: node scripts/conformance/perf/legacy.js
      - name: Build and qualify every distribution artifact
        run: |
          npm run build
          npm run standalone
          npm run test:packages
          node scripts/conformance/perf/size-budget.js --policy-ref "$PERF_POLICY" --output artifacts/results/performance/sizes.json
      - name: Require unmodified source
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-paired-${{ github.run_id }}
          path: artifacts/results/
          retention-days: 30
          if-no-files-found: error
  browser:
    needs: paired
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Measure real Studio with traces
        run: python tests/conformance/browser/perf_test.py --engine ${{ matrix.engine }} --iterations 5
      - name: Require unmodified source
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-browser-${{ matrix.engine }}-${{ github.run_id }}
          path: artifacts/results/performance/browser/
          retention-days: 30
          if-no-files-found: error
