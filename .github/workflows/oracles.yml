name: Pinned reference oracles
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-oracles-${{ github.ref }}
  cancel-in-progress: false
env:
  SHARPFORGE_RESULTS_DIR: artifacts/results
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    env:
      SHARPFORGE_ORACLE_CONTAINER: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the mounted checkout in the SDK container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Native runner regression tests
        run: node --test --test-concurrency=1 tests/conformance/oracle/*.test.js tests/conformance/oracle/*.native.js
      - name: Compile twice, execute twice and verify expected outputs
        if: always()
        run: node scripts/conformance/oracle/qualify.js --verify
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oracle-linux-x64
          path: artifacts/results/oracles/
          if-no-files-found: error
  desktop:
    needs: linux
    name: native oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.201'
      - name: Native runner regression tests
        run: node --test --test-concurrency=1 tests/conformance/oracle/*.test.js tests/conformance/oracle/*.native.js
      - name: Compile twice, execute twice and verify expected outputs
        if: always()
        run: node scripts/conformance/oracle/qualify.js --verify
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oracle-${{ matrix.os }}
          path: artifacts/results/oracles/
          if-no-files-found: error
