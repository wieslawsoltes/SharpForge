name: Pinned reference oracles
on:
  pull_request:
    paths:
      - '.github/workflows/oracles.yml'
      - 'scripts/conformance/oracle/**'
      - 'tests/conformance/oracle/**'
      - 'tests/conformance/expected/**'
      - 'planning/qualification/oracle*'
      - 'planning/qualification/expected.schema.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oracles.yml'
      - 'scripts/conformance/oracle/**'
      - 'tests/conformance/oracle/**'
      - 'tests/conformance/expected/**'
      - 'planning/qualification/oracle*'
      - 'planning/qualification/expected.schema.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-oracles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SHARPFORGE_RESULTS_DIR: artifacts/results
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    env:
      SHARPFORGE_ORACLE_CONTAINER: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Native runner regression tests
        run: node --test tests/conformance/oracle/*.test.js
      - name: Compile twice, execute twice and verify expected outputs
        if: always()
        run: node scripts/conformance/oracle/qualify.js --verify
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-linux-x64
          path: artifacts/results/oracles/
          if-no-files-found: error
  desktop:
    name: native oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.201'
      - name: Native runner regression tests
        run: node --test tests/conformance/oracle/*.test.js
      - name: Compile twice, execute twice and verify expected outputs
        if: always()
        run: node scripts/conformance/oracle/qualify.js --verify
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-${{ matrix.os }}
          path: artifacts/results/oracles/
          if-no-files-found: error
