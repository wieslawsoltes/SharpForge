name: A05 native runtime qualification
# Additional focused evidence for the authorized A05 PR; ordinary CI policy is unchanged.
on:
  push:
    branches: [codex/a05-e01-started-handoff-20261004]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Separate skipped PR events from push qualification of the same branch.
  group: >-
    ${{ format('a05-native-{0}-{1}-{2}', github.event_name,
        github.event.pull_request.head.repo.full_name || github.repository,
        github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
defaults:
  run:
    shell: bash
jobs:
  native:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/a05-e01-started-handoff-20261004') ||
          (github.event_name == 'pull_request' &&
           (github.event.pull_request.head.repo.full_name != github.repository ||
            github.head_ref != 'codex/a05-e01-started-handoff-20261004') &&
           contains(github.event.pull_request.labels.*.name, 'full-ci') &&
           contains(github.event.pull_request.title, 'SF-A05')) }}
    name: A05 / ${{ matrix.os }} / SDK ${{ matrix.sdk.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk:
          - {version: '8.0.x', framework: 'net8.0'}
          - {version: '10.0.201', framework: 'net10.0'}
    env:
      SHARPFORGE_A05_SDK_CHANNEL: ${{ matrix.sdk.version }}
      DOTNET_TARGET_FRAMEWORK: ${{ matrix.sdk.framework }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        id: dotnet
        with:
          dotnet-version: ${{ matrix.sdk.version }}
      - name: Pin CLI selection to the matrix SDK
        env:
          SHARPFORGE_A05_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: >-
          node --input-type=module -e "import {writeFileSync} from 'node:fs';
          writeFileSync('global.json', JSON.stringify({sdk:{version:process.env.SHARPFORGE_A05_SDK,rollForward:'disable'}})+'\n');"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify every A05 native fixture independently and serially
        env:
          SHARPFORGE_A05_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: node scripts/a05-native-qualification.js --output artifacts/a05-native
      - name: Preserve setup and interruption failures
        if: always()
        env:
          SHARPFORGE_A05_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: node scripts/a05-native-qualification.js --finalize --output artifacts/a05-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a05-native-${{ matrix.os }}-${{ matrix.sdk.version }}
          path: artifacts/a05-native/
          if-no-files-found: error
          retention-days: 14
  native-width-x86:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/a05-e01-started-handoff-20261004') ||
          (github.event_name == 'pull_request' &&
           (github.event.pull_request.head.repo.full_name != github.repository ||
            github.head_ref != 'codex/a05-e01-started-handoff-20261004') &&
           contains(github.event.pull_request.labels.*.name, 'full-ci') &&
           contains(github.event.pull_request.title, 'SF-A05')) }}
    name: A05 / Windows x86 width / SDK ${{ matrix.sdk.version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sdk:
          - {version: '8.0.425', framework: 'net8.0'}
          - {version: '10.0.201', framework: 'net10.0'}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the hash-verified official x86 SDK in an isolated directory
        shell: pwsh
        run: ./scripts/a05/install-native-x86.ps1 -SdkVersion '${{ matrix.sdk.version }}'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare actual 32-bit CLR output with all configured VM routes
        run: >-
          node scripts/validate-a05-type-system.js --fixture tests/fixtures/a05/native-width
          --source-routes --expected tests/fixtures/a05/native-width/expected-32.txt
          --framework '${{ matrix.sdk.framework }}' --dotnet "$DOTNET_PATH"
          --output artifacts/a05-native-width
      - name: Require observed native process width and retain an explicit final outcome
        if: always()
        run: >-
          node scripts/a05/verify-native-width.js artifacts/a05-native-width 32 '${{ matrix.sdk.version }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: a05-native-width-windows-x86-${{ matrix.sdk.version }}
          path: artifacts/a05-native-width/
          if-no-files-found: error
          retention-days: 14
