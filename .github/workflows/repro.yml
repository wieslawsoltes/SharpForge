name: Reproducible release qualification
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['scripts/conformance/repro/**', 'scripts/conformance/source-manifest.js', 'tests/conformance/repro/**', 'planning/qualification/repro/**', '.github/workflows/repro.yml']
  push:
    branches: [main]
    paths: ['scripts/conformance/repro/**', 'scripts/conformance/source-manifest.js', 'scripts/build*.js', 'scripts/standalone.js', 'packages/**', 'examples/**', 'package*.json', '.github/workflows/repro.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose exact source and published assets must reproduce (empty checks HEAD)
        type: string
        required: false
  release:
    types: [published]
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: repro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      release: ${{ steps.source.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Download exact source and vendor lock-bound npm cache
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPRO_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p artifacts
          if [ -n "$REPRO_TAG" ]; then
            node scripts/conformance/repro/prepare.js --tag "$REPRO_TAG"
          else
            node scripts/conformance/repro/prepare.js
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repro-inputs
          path: artifacts/repro-inputs
          include-hidden-files: true
          if-no-files-found: error
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repro-inputs
          path: artifacts/repro-inputs
      - name: Build twice with reversed extraction order and different source mtimes
        env:
          REPRO_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: node scripts/conformance/repro/double-build.js --ref "$REPRO_COMMIT" --archive artifacts/repro-inputs/source.zip --cache artifacts/repro-inputs/vendored-cache
      - name: Regenerate all six example generators in both orders
        env:
          REPRO_COMMIT: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: node scripts/conformance/repro/examples.js --ref "$REPRO_COMMIT" --archive artifacts/repro-inputs/source.zip --cache artifacts/repro-inputs/vendored-cache
      - name: Verify documentation links against tracked files and produced release assets
        run: node scripts/conformance/repro/link-check.js --assets artifacts/results/repro/double-build/payloads
      - name: Require clean tracked checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repro-${{ matrix.os }}
          path: artifacts/results/repro
          if-no-files-found: error
  cross-runner:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: repro-*-*
          path: artifacts/repro-runners
      - name: Require identical dist, HTML, tarballs, ZIP and golden compiler outputs
        run: node scripts/conformance/repro/aggregate.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repro-cross-runner
          path: artifacts/results/repro/cross-runner.json
          if-no-files-found: error
  offline:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repro-inputs
          path: artifacts/repro-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repro-ubuntu-24.04
          path: artifacts/repro-linux
      - name: Rebuild exact downloaded source with network disabled
        env:
          REPRO_COMMIT: ${{ needs.prepare.outputs.commit }}
          HAS_RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          NODE="$(command -v node)"
          ASSETS=artifacts/repro-linux/double-build/payloads
          if [ "$HAS_RELEASE" = true ]; then ASSETS=artifacts/repro-inputs/release-assets; fi
          sudo unshare --net -- "$NODE" scripts/conformance/repro/offline.js --ref "$REPRO_COMMIT" --archive artifacts/repro-inputs/source.zip --cache artifacts/repro-inputs/vendored-cache --assets "$ASSETS" --require-network-isolation
      - name: Require clean tracked checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repro-offline
          path: artifacts/results/repro/offline.json
          if-no-files-found: error
  external-links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: node scripts/conformance/repro/link-check.js --external
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repro-external-links
          path: artifacts/results/repro/links.json
          if-no-files-found: error
