name: Agent lease and readiness labels
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: planning-lease-reaper
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Label expired leases and synchronize issue readiness labels
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_READ_TOKEN: ${{ secrets.PLANNING_PROJECT_READ_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/conformance/leases/reconcile.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lease-reconciliation-${{ github.run_id }}
          path: |
            artifacts/lease-reconciliation.json*
          if-no-files-found: error
