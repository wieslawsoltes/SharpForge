name: Validate SharpForge
on:
  push:
    branches-ignore: ['agent/**', 'agent-ops/**', 'agent-locks/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SHARPFORGE_RESULTS_DIR: artifacts/results
  SHARPFORGE_STANDALONE_PATH: artifacts/SharpForge-standalone.html
  PYTHON: python
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node --test tests/conformance/*.test.js
      - run: python -m unittest discover -s tests/conformance/browser -p 'test_*.py'
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: core-${{ matrix.os }}
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/standalone.js
      - uses: actions/upload-artifact@v4
        with:
          name: sharpforge-browser
          path: |
            dist/
            artifacts/SharpForge-standalone.html
          if-no-files-found: error
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: build
  packages:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:packages
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: sharpforge-packages
          path: artifacts/*.tgz
          if-no-files-found: error
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: packages-${{ matrix.os }}
  browser:
    needs: build
    name: browser (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [browser, managed, workspace, release05, release06, msbuild, release08, native-explorer, release09, release10, release11, release12, release13, release14, standalone]
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: sharpforge-browser
          path: .
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/requirements.txt') }}
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify failure and cancellation artifacts
        if: matrix.suite == 'browser'
        run: python tests/conformance/browser/artifact_smoke.py
      - name: Measure launcher cold/warm latency and Python allocations
        if: matrix.suite == 'browser'
        run: python tests/conformance/browser/benchmark.py --iterations 10
      - name: Run isolated browser suite over production HTTP/CSP
        run: python tests/conformance/browser/run_suite.py ${{ matrix.suite }} --timeout 1200
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.suite }}
  native-il:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:dotnet
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: native-il-${{ matrix.os }}-${{ matrix.dotnet }}
  native-msbuild:
    # Actual SDKs/processes only; browser test doubles cannot satisfy this gate.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:msbuild:native
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: native-msbuild-${{ matrix.os }}
  clr-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record explicit CLR Wasm exclusion
        run: node scripts/conformance/record-skips.js clr-wasm
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: clr-wasm
  ci-ok:
    if: always()
    needs: [core, build, packages, browser, native-il, native-msbuild, clr-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require every qualification job to succeed
        env:
          SHARPFORGE_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/conformance/ci-status.js
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: ci-ok
