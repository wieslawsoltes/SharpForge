name: Validate SharpForge
# Ordinary PRs run one core job. Full qualification requires main/manual/merge queue
# execution or the full-ci PR label; tag releases call this workflow in full.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SHARPFORGE_RESULTS_DIR: artifacts/results
  SHARPFORGE_STANDALONE_PATH: artifacts/SharpForge-standalone.html
  PYTHON: python
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        with:
          python-version: '3.12'
      - name: Full qualification infrastructure regressions
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: |
          node --test tests/conformance/*.test.js
          python -m unittest discover -s tests/conformance/browser -p 'test_*.py'
      - uses: ./.github/actions/qualification-evidence
        if: ${{ always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        with:
          name: core-ubuntu-latest
      - name: Record provenance for the existing PR preview build
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/conformance/release-policy/preview.js --record
      - name: Upload PR preview without a second build or deployment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            artifacts/preview.json
          if-no-files-found: error
          retention-days: 7
  core-platforms:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node --test tests/conformance/*.test.js
      - run: python -m unittest discover -s tests/conformance/browser -p 'test_*.py'
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: core-${{ matrix.os }}
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Require the reviewed release toolchain
        run: node --input-type=module -e "import {assertToolchain} from './scripts/conformance/repro/build.js'; await assertToolchain(process.cwd());"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/standalone.js
      - name: Seal qualified browser payload bytes
        run: node scripts/conformance/supply/seal.js create browser artifacts/BROWSER-BUILD-MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sharpforge-browser
          path: |
            dist/
            artifacts/SharpForge-standalone.html
            artifacts/BROWSER-BUILD-MANIFEST.json
          if-no-files-found: error
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: build
  packages:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Require the reviewed release toolchain
        run: node --input-type=module -e "import {assertToolchain} from './scripts/conformance/repro/build.js'; await assertToolchain(process.cwd());"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:packages
      - name: Seal qualified package payload bytes
        run: node scripts/conformance/supply/seal.js create packages artifacts/PACKAGE-BUILD-MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: sharpforge-packages
          path: |
            artifacts/*.tgz
            artifacts/PACKAGE-BUILD-MANIFEST.json
          if-no-files-found: error
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: packages-${{ matrix.os }}
  browser:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: build
    name: browser (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [browser, managed, workspace, release05, release06, msbuild, release08, native-explorer, release09, release10, release11, release12, release13, release14, standalone]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sharpforge-browser
          path: .
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/requirements.txt') }}
      - run: "python -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt"
      - run: python -m playwright install --with-deps chromium
      - name: Verify failure and cancellation artifacts
        if: matrix.suite == 'browser'
        run: python tests/conformance/browser/artifact_smoke.py
      - name: Measure launcher cold/warm latency and Python allocations
        if: matrix.suite == 'browser'
        run: python tests/conformance/browser/benchmark.py --iterations 10
      - name: Run isolated browser suite over production HTTP/CSP
        run: python tests/conformance/browser/run_suite.py ${{ matrix.suite }} --timeout 1200
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: browser-${{ matrix.os }}-${{ matrix.suite }}
  native-il:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:dotnet
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: native-il-${{ matrix.os }}-${{ matrix.dotnet }}
  native-msbuild:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Actual SDKs/processes only; browser test doubles cannot satisfy this gate.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:msbuild:native
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: native-msbuild-${{ matrix.os }}
  clr-wasm:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Record explicit CLR Wasm exclusion
        run: node scripts/conformance/record-skips.js clr-wasm
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: clr-wasm
  ci-ok:
    if: ${{ always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    needs: [core, core-platforms, build, packages, browser, native-il, native-msbuild, clr-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture starting environment
        run: node scripts/conformance/env-report.js
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every qualification job to succeed
        env:
          SHARPFORGE_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/conformance/ci-status.js
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: ci-ok
