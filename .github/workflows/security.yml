name: Supply chain and code security
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  supply:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: "python -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt"
      - name: Workflow, vendor, license and source secret gates
        run: |
          python scripts/conformance/supply/workflow-lint.py
          node scripts/conformance/supply/pin-actions.js
          node scripts/conformance/supply/verify-vendor.js
          node scripts/conformance/supply/license-gate.js
          node scripts/conformance/supply/secret-scan.js
          node scripts/conformance/static/check-imports.js --output artifacts/security/static-imports.json
      - name: Positive, negative, bounds and cancellation regressions
        run: |
          node --test --test-concurrency=1 tests/conformance/supply/*.test.js tests/conformance/security/*.test.js
          python -m unittest discover -s tests/conformance/supply -p 'test_*.py'
      - name: Build actual payloads and SBOM
        run: |
          npm run build
          npm run standalone
          node scripts/conformance/security/header-probe.js dist/index.html --output artifacts/security/csp-browser.json
          node scripts/conformance/security/header-probe.js artifacts/SharpForge-standalone.html --standalone --output artifacts/security/csp-standalone.json
          npm run test:packages
          node scripts/conformance/repro/package-release.js
          node scripts/conformance/supply/sbom.js
          python scripts/conformance/supply/validate-sbom.py artifacts/SBOM.cdx.json
          node scripts/conformance/supply/secret-scan.js . dist artifacts
      - name: Verify checkout integrity
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: supply-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  codeql:
    needs: supply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
