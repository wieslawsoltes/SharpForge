name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm test && npm run build
      - run: npm run test:packages
      - run: node scripts/standalone.js && cp SharpForge-standalone.html artifacts/
      - run: cd dist && zip -r ../artifacts/SharpForge-browser.zip .
      - name: Attach artifacts to tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "SharpForge $GITHUB_REF_NAME"
