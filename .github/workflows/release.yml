name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Gate versions, specification review and required manual environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/conformance/release/version-check.js
          node scripts/conformance/release-policy/check-policy.js
          node scripts/conformance/release-policy/environment.js
  qualification:
    needs: policy
    uses: ./.github/workflows/ci.yml
    with:
      qualification: true
  build:
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sharpforge-browser
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sharpforge-packages
          path: artifacts
      - name: Verify original qualified bytes before packaging
        run: |
          node scripts/conformance/supply/seal.js verify browser artifacts/BROWSER-BUILD-MANIFEST.json
          node scripts/conformance/supply/seal.js verify packages artifacts/PACKAGE-BUILD-MANIFEST.json
          python scripts/conformance/supply/workflow-lint.py
          node scripts/conformance/supply/pin-actions.js
          node scripts/conformance/supply/verify-vendor.js
          node scripts/conformance/supply/license-gate.js
          node scripts/conformance/supply/secret-scan.js . dist artifacts
      - name: Package and inventory verified release subjects
        run: |
          node scripts/conformance/repro/package-release.js
          node scripts/conformance/supply/sbom.js
          python scripts/conformance/supply/validate-sbom.py artifacts/SBOM.cdx.json
          node scripts/conformance/source-manifest.js --generate
          node scripts/conformance/source-manifest.js --verify
          node scripts/conformance/supply/attestation.js subjects > artifacts/ATTESTATION-SUBJECTS.txt
          node scripts/conformance/clean-checkout.js
      - name: Attest each release asset
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/*.tgz
            artifacts/SharpForge-browser.zip
            artifacts/SharpForge-standalone.html
            artifacts/SOURCE-MANIFEST.json
            artifacts/SHA256SUMS
            artifacts/SBOM.cdx.json
      - name: Retain the attestation proof for draft release assets
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$ATTESTATION_BUNDLE" artifacts/provenance.sigstore.json
      - name: Verify GitHub signatures and exact signer/source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/conformance/supply/attestation.js verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: release-build-evidence
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-release
          path: artifacts
      - name: Verify downloaded release subjects before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/conformance/source-manifest.js --verify-payloads
          node scripts/conformance/clean-checkout.js
      - name: Create only a verified draft with all assets and attestation proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/conformance/release-policy/release.js draft --execute
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: release-draft-evidence
  publish:
    needs: draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-release
          path: artifacts
      - name: Reverify exact payloads before the manually approved publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/conformance/source-manifest.js --verify-payloads
          node scripts/conformance/clean-checkout.js
          node scripts/conformance/release-policy/release.js publish --execute
      - uses: ./.github/actions/qualification-evidence
        if: always()
        with:
          name: release-publish-evidence
