name: Review upstream specification revisions
on:
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spec-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Open one review issue per changed revision without updating any policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/conformance/release-policy/spec-watch.js --write-issues
      - run: node scripts/conformance/clean-checkout.js
