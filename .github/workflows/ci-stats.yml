name: Weekly PR CI budget
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Collect attempt-specific queue/job duration evidence and enforce PR budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/conformance/ci-stats.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: weekly-ci-stats-${{ github.run_id }}
          path: artifacts/ci-stats.json*
          if-no-files-found: error
