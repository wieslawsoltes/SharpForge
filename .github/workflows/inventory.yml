name: Reference gap inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  SHARPFORGE_RESULTS_DIR: artifacts/results
jobs:
  linux:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    env:
      SHARPFORGE_ORACLE_CONTAINER: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore exact WinMD package inputs without native execution
        working-directory: tests/conformance/oracle/WinUI
        run: dotnet restore Oracle.WinUI.csproj --locked-mode -p:EnableWindowsTargeting=true
      - name: Generate actual reference inventories and independent JS VM observations
        run: node scripts/conformance/inventory/generate.js --check
      - name: Run native metadata extraction and negative tests
        if: always()
        run: node --test --test-concurrency=1 tests/conformance/inventory/*.native.js
      - name: Inventory correctness and boundary tests
        if: always()
        run: node --test --test-concurrency=1 tests/conformance/inventory/*.test.js
      - name: Measured VM probe cost with correctness gates
        run: node scripts/conformance/inventory/benchmark.js
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: inventory-native-linux-x64
          path: artifacts/results/inventory/
          if-no-files-found: error
  desktop:
    needs: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.201'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore exact WinMD package inputs without native execution
        working-directory: tests/conformance/oracle/WinUI
        run: dotnet restore Oracle.WinUI.csproj --locked-mode -p:EnableWindowsTargeting=true
      - name: Generate actual reference inventories and independent JS VM observations
        run: node scripts/conformance/inventory/generate.js --check
      - name: Run native metadata extraction and negative tests
        if: always()
        run: node --test --test-concurrency=1 tests/conformance/inventory/*.native.js
      - name: Inventory correctness and boundary tests
        if: always()
        run: node --test --test-concurrency=1 tests/conformance/inventory/*.test.js
      - name: Measured VM probe cost with correctness gates
        run: node scripts/conformance/inventory/benchmark.js
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: inventory-native-${{ matrix.os }}
          path: artifacts/results/inventory/
          if-no-files-found: error
  browser:
    needs: desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --requirement tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Browser compiler and both JS VM observations
        run: python tests/conformance/inventory/browser_probe.py
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: inventory-browser-${{ matrix.os }}
          path: artifacts/results/
          if-no-files-found: error
