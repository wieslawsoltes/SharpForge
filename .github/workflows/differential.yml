name: Cross-engine differential corpus
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    env:
      SHARPFORGE_ORACLE_CONTAINER: mcr.microsoft.com/dotnet/sdk:10.0.201-noble@sha256:127d7d4d601ae26b8e04c54efb37e9ce8766931bded0ee59fcd799afd21d6850
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the mounted checkout in the pinned container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and mandatory native adapter/reducer tests
        run: node --test --test-concurrency=1 tests/conformance/differential/differential.test.js tests/conformance/differential/engines.native.js
      - name: Run pinned corpus and reject new differences
        if: always()
        run: node scripts/conformance/diff/run.js
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: differential-linux-x64
          path: artifacts/differential/
          if-no-files-found: error
  desktop:
    needs: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.201'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and mandatory native adapter/reducer tests
        run: node --test --test-concurrency=1 tests/conformance/differential/differential.test.js tests/conformance/differential/engines.native.js
      - name: Run pinned corpus and reject new differences
        if: always()
        run: node scripts/conformance/diff/run.js
      - name: Require a clean checkout
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: differential-${{ matrix.os }}
          path: artifacts/differential/
          if-no-files-found: error
