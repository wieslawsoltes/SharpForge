name: Locate PR preview artifact
# The ordinary PR core job already uploads its existing dist. This optional
# read-only locator adds no automatic PR job and never executes downloaded code.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful pull-request core workflow run whose preview artifact to locate
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Link an exact retained PR artifact; never deploy to production Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/conformance/release-policy/preview.js --run-id "$PREVIEW_RUN_ID"
