name: Rust and Wasm workspace
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '1'
  RUST_TEST_THREADS: '1'
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require pinned fmt, clippy, tests, Wasm, cargo-deny and Miri when rust exists
        run: python scripts/conformance/rust/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rust-qualification.json
          if-no-files-found: error
