name: Browser platform qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-matrix-${{ github.ref }}
  cancel-in-progress: false
env:
  SHARPFORGE_RESULTS_DIR: artifacts/results
  SHARPFORGE_STANDALONE_PATH: artifacts/SharpForge-standalone.html
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/standalone.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-matrix-application
          path: |
            dist/
            artifacts/SharpForge-standalone.html
          if-no-files-found: error
  browsers:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        engine: [chromium, firefox, webkit]
        suite: [smoke]
        include:
          - {os: ubuntu-latest, engine: chromium, suite: mobile}
          - {os: ubuntu-latest, engine: firefox, suite: mobile}
          - {os: ubuntu-latest, engine: webkit, suite: mobile}
          - {os: ubuntu-latest, engine: chromium, suite: a11y}
          - {os: ubuntu-latest, engine: firefox, suite: a11y}
          - {os: ubuntu-latest, engine: webkit, suite: a11y}
          - {os: ubuntu-latest, engine: chromium, suite: harness}
          - {os: ubuntu-latest, engine: firefox, suite: harness}
          - {os: ubuntu-latest, engine: webkit, suite: harness}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-matrix-application
          path: .
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Verify CSP violation failure gate in actual browser
        if: matrix.suite == 'smoke'
        run: python tests/conformance/browser/csp_smoke.py --engine ${{ matrix.engine }}
      - name: Verify accessible-name audit negative fixture
        if: matrix.suite == 'a11y'
        run: python tests/conformance/browser/accessibility_smoke.py --engine ${{ matrix.engine }}
      - name: Verify editor and touch interaction regressions
        if: matrix.suite == 'a11y'
        run: python tests/conformance/browser/ui_regressions.py --engine ${{ matrix.engine }}
      - name: Measure correctness-gated cold and warm browser latency
        if: matrix.suite == 'smoke'
        run: python scripts/conformance/browser/latency.py --engine ${{ matrix.engine }}
      - name: Verify Studio text rendering under the enforced CSP
        if: matrix.suite == 'harness' && matrix.engine == 'chromium'
        run: python tests/conformance/browser/run_suite.py security --timeout 600
      - name: Run all modes and retain individual failures
        if: always()
        run: python tests/conformance/browser/run_matrix.py --engine ${{ matrix.engine }} --suite ${{ matrix.suite }} --timeout 180
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-matrix-${{ matrix.os }}-${{ matrix.engine }}-${{ matrix.suite }}
          path: artifacts/results/
          if-no-files-found: error
  report:
    if: always()
    needs: browsers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: browser-matrix-*-*-*
          path: artifacts/browser-matrix/
      - name: Merge measured categories
        run: |
          python - <<'PY'
          import pathlib, subprocess
          paths=sorted(str(p) for p in pathlib.Path('artifacts/browser-matrix').rglob('result.json'))
          assert paths, 'No measured browser results'
          subprocess.run(['node','scripts/conformance/browser-report.js','--output','planning/qualification/browser-matrix.json',*paths],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-qualification-categories
          path: planning/qualification/browser-matrix.json
          if-no-files-found: error
