name: Native platform qualification
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SHARPFORGE_RESULTS_DIR: artifacts/results
  SHARPFORGE_STANDALONE_PATH: artifacts/SharpForge-standalone.html
defaults:
  run:
    shell: bash
jobs:
  sdk:
    name: SDK ${{ matrix.sdk }} / ${{ matrix.target.platform }}-${{ matrix.target.architecture }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    env:
      NATIVE_PLATFORM: ${{ matrix.target.platform }}
      NATIVE_ARCH: ${{ matrix.target.architecture }}
      NATIVE_VERSION: ${{ matrix.sdk }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sdk: ["8.0.425", "10.0.201"]
        target:
          - { platform: linux, architecture: x64, runner: ubuntu-24.04 }
          - { platform: linux, architecture: arm64, runner: ubuntu-24.04-arm }
          - { platform: win32, architecture: x64, runner: windows-2025 }
          - { platform: win32, architecture: arm64, runner: windows-11-arm }
          - { platform: darwin, architecture: x64, runner: macos-15-intel }
          - { platform: darwin, architecture: arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"
          architecture: ${{ matrix.target.architecture }}
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual SDK, emitted IL, MSBuild, cancellation and allocation fixtures
        run: node scripts/conformance/native/qualify.js --suite sdk --version "$NATIVE_VERSION" --platform "$NATIVE_PLATFORM" --architecture "$NATIVE_ARCH" --measure
      - name: Preserve setup failures as explicit failed cells
        if: always()
        run: node scripts/conformance/native/finalize.js sdk "$NATIVE_VERSION" "$NATIVE_PLATFORM" "$NATIVE_ARCH"
      - name: Require unchanged tracked output
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-sdk-${{ matrix.target.platform }}-${{ matrix.target.architecture }}-${{ matrix.sdk }}
          path: artifacts/results/native/
          if-no-files-found: error
  node:
    needs: sdk
    name: Node ${{ matrix.node }} / ${{ matrix.target.platform }}-${{ matrix.target.architecture }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    env:
      NATIVE_PLATFORM: ${{ matrix.target.platform }}
      NATIVE_ARCH: ${{ matrix.target.architecture }}
      NATIVE_VERSION: ${{ matrix.node }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        node: ["22.23.3", "26.10.0"]
        target:
          - { platform: linux, architecture: x64, runner: ubuntu-24.04 }
          - { platform: linux, architecture: arm64, runner: ubuntu-24.04-arm }
          - { platform: win32, architecture: x64, runner: windows-2025 }
          - { platform: win32, architecture: arm64, runner: windows-11-arm }
          - { platform: darwin, architecture: x64, runner: macos-15-intel }
          - { platform: darwin, architecture: arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.architecture }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run core check, test, build and actual host filesystem/process probes
        run: node scripts/conformance/native/qualify.js --suite host --version "$NATIVE_VERSION" --platform "$NATIVE_PLATFORM" --architecture "$NATIVE_ARCH" --core --measure
      - name: Preserve setup failures as explicit failed cells
        if: always()
        run: node scripts/conformance/native/finalize.js host "$NATIVE_VERSION" "$NATIVE_PLATFORM" "$NATIVE_ARCH"
      - name: Require unchanged tracked output
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-node-${{ matrix.target.platform }}-${{ matrix.target.architecture }}-${{ matrix.node }}
          path: artifacts/results/native/
          if-no-files-found: error
  matrix:
    if: ${{ always() }}
    needs: [sdk, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: artifacts/native-downloads
      - name: Aggregate exact host versions and run provenance; missing cells fail
        run: node scripts/conformance/native/matrix-report.js --input artifacts/native-downloads --output artifacts/results/native/platform-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-platform-matrix
          path: artifacts/results/native/platform-matrix.json
          if-no-files-found: error
      - name: Require unchanged tracked output
        if: always()
        run: node scripts/conformance/clean-checkout.js
