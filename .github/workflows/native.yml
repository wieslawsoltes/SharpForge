name: Native platform qualification
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/native.yml"
      - "scripts/conformance/**"
      - "tests/conformance/native/**"
      - "packages/**"
      - "apps/cli/**"
      - "planning/qualification/native/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native.yml"
      - "scripts/conformance/**"
      - "tests/conformance/native/**"
      - "packages/**"
      - "apps/cli/**"
      - "planning/qualification/native/**"
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 5 * * 3"
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SHARPFORGE_RESULTS_DIR: artifacts/results
  SHARPFORGE_STANDALONE_PATH: artifacts/SharpForge-standalone.html
jobs:
  sdk:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: SDK ${{ matrix.sdk }} / ${{ matrix.target.platform }}-${{ matrix.target.architecture }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ["8.0.425", "10.0.201"]
        target:
          - { platform: linux, architecture: x64, runner: ubuntu-24.04 }
          - { platform: linux, architecture: arm64, runner: ubuntu-24.04-arm }
          - { platform: win32, architecture: x64, runner: windows-2025 }
          - { platform: win32, architecture: arm64, runner: windows-11-arm }
          - { platform: darwin, architecture: x64, runner: macos-15-intel }
          - { platform: darwin, architecture: arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"
          architecture: ${{ matrix.target.architecture }}
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute actual SDK, emitted IL, MSBuild, cancellation and allocation fixtures
        run: node scripts/conformance/native/qualify.js --suite sdk --version ${{ matrix.sdk }} --platform ${{ matrix.target.platform }} --architecture ${{ matrix.target.architecture }} --measure
      - name: Preserve setup failures as explicit failed cells
        if: always()
        run: node scripts/conformance/native/finalize.js sdk ${{ matrix.sdk }} ${{ matrix.target.platform }} ${{ matrix.target.architecture }}
      - name: Require unchanged tracked output
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-sdk-${{ matrix.target.platform }}-${{ matrix.target.architecture }}-${{ matrix.sdk }}
          path: artifacts/results/native/
          if-no-files-found: error
  node:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Node ${{ matrix.node }} / ${{ matrix.target.platform }}-${{ matrix.target.architecture }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.3", "26.10.0"]
        target:
          - { platform: linux, architecture: x64, runner: ubuntu-24.04 }
          - { platform: linux, architecture: arm64, runner: ubuntu-24.04-arm }
          - { platform: win32, architecture: x64, runner: windows-2025 }
          - { platform: win32, architecture: arm64, runner: windows-11-arm }
          - { platform: darwin, architecture: x64, runner: macos-15-intel }
          - { platform: darwin, architecture: arm64, runner: macos-26 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.target.architecture }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run core check, test, build and actual host filesystem/process probes
        run: node scripts/conformance/native/qualify.js --suite host --version ${{ matrix.node }} --platform ${{ matrix.target.platform }} --architecture ${{ matrix.target.architecture }} --core --measure
      - name: Preserve setup failures as explicit failed cells
        if: always()
        run: node scripts/conformance/native/finalize.js host ${{ matrix.node }} ${{ matrix.target.platform }} ${{ matrix.target.architecture }}
      - name: Require unchanged tracked output
        if: always()
        run: node scripts/conformance/clean-checkout.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-node-${{ matrix.target.platform }}-${{ matrix.target.architecture }}-${{ matrix.node }}
          path: artifacts/results/native/
          if-no-files-found: error
  matrix:
    if: ${{ always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    needs: [sdk, node]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: artifacts/native-downloads
      - name: Aggregate exact host versions and run provenance; missing cells fail
        run: node scripts/conformance/native/matrix-report.js --input artifacts/native-downloads --output artifacts/results/native/platform-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-platform-matrix
          path: artifacts/results/native/platform-matrix.json
          if-no-files-found: error
      - name: Require unchanged tracked output
        if: always()
        run: node scripts/conformance/clean-checkout.js
