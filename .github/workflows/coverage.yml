name: Per-area package coverage
on:
  workflow_dispatch:
    inputs:
      area:
        description: Area ID (empty runs all manifests)
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
jobs:
  coverage:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure area manifests and enforce reviewed floors
        env:
          COVERAGE_AREA: ${{ inputs.area }}
        run: |
          if [ -n "$COVERAGE_AREA" ]; then
            node scripts/conformance/coverage.js --area "$COVERAGE_AREA"
          else
            node scripts/conformance/coverage.js
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-coverage
          path: |
            planning/qualification/coverage.json
            artifacts/coverage/
          if-no-files-found: error
