name: Per-area package coverage
on:
  workflow_dispatch:
    inputs:
      area:
        description: Area ID (empty runs all manifests)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure area manifests and enforce reviewed floors
        env:
          COVERAGE_AREA: ${{ inputs.area }}
        run: |
          if [ -n "$COVERAGE_AREA" ]; then
            node scripts/conformance/coverage.js --area "$COVERAGE_AREA"
          else
            node scripts/conformance/coverage.js
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-coverage
          path: |
            planning/qualification/coverage.json
            artifacts/coverage/
          if-no-files-found: error
