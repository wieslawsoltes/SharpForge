name: Preserve qualification evidence
description: Capture final environment and fail on checkout mutations before uploading all evidence.
inputs:
  name:
    description: Unique job and matrix artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Capture exact final environment
      if: always()
      shell: bash
      run: node scripts/conformance/env-report.js
    - name: Require a clean checkout
      if: always()
      shell: bash
      run: node scripts/conformance/clean-checkout.js
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: ${{ inputs.name }}
        path: artifacts/results/
        if-no-files-found: error
